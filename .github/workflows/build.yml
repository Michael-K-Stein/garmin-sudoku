name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache the Connect IQ SDK
        uses: actions/cache@v4
        with:
          path: dist/sdk
          key: connectiq-sdk-${{ hashFiles('tools/build.sh') }}

      # The layout, the tier table and the difficulty claims, none of which
      # need the SDK.
      - name: Check the code against its own invariants
        run: tools/verify.sh

      - name: Build for the Venu 2 family
        run: tools/build.sh --fetch-sdk

      # The build already runs with --warn; this fails the job on a warning,
      # which is the only way "compiles clean" stays true.
      - name: Fail on any compiler warning
        run: |
          tools/build.sh 2>&1 | tee dist/build.log
          if grep -q "^WARNING" dist/build.log; then
            echo "::error::the build produced warnings"
            grep "^WARNING" dist/build.log
            exit 1
          fi

      - name: Compile the unit tests
        run: tools/test.sh

      - uses: actions/upload-artifact@v5
        with:
          name: sudoku-prg
          path: dist/*.prg
          if-no-files-found: error
